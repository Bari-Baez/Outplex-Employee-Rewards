name: Git history secret evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan complete history with redacted output
        run: node scripts/secret-history-scan.mjs --report artifacts/history-secret-report.json
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-report
          path: artifacts/history-secret-report.json
          if-no-files-found: warn
          retention-days: 14

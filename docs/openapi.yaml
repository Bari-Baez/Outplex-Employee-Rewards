  # ═══════════════════════════════════════
  # STORE (NYT Company Store)
  # ═══════════════════════════════════════

  /api/store/items:
    post:
      tags: [Store]
      summary: Create a store item
      description: Adds a new redeemable item to the company store. Requires moderator_a1+.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, points_cost, stock]
              properties:
                name:
                  type: string
                description:
                  type: string
                points_cost:
                  type: integer
                stock:
                  type: integer
                image_url:
                  type: string
                is_active:
                  type: boolean
                category:
                  type: string
      responses:
        '200':
          description: Created item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/StoreItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/store/items/{itemId}:
    patch:
      tags: [Store]
      summary: Update a store item
      description: Edits item properties; triggers low-stock alerts when stock drops below threshold.
      security:
        - sessionCookie: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                points_cost:
                  type: integer
                stock:
                  type: integer
                image_url:
                  type: string
                is_active:
                  type: boolean
                category:
                  type: string
      responses:
        '200':
          description: Updated item
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Store]
      summary: Soft-delete a store item
      security:
        - sessionCookie: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/store/checkout:
    post:
      tags: [Store]
      summary: Process store checkout
      description: Atomically validates the cart, deducts points, reserves stock, creates one grouped order, and records outbox events.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key reused for retries of the same logical checkout.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart]
              properties:
                cart:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [item, quantity]
                    properties:
                      item:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
      responses:
        '200':
          description: Checkout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  totalPoints:
                    type: integer
                  orderCount:
                    type: integer
                  orderId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/store/favorites:
    get:
      tags: [Store]
      summary: Get favorited item IDs
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Favorite item IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoriteItemIds:
                    type: array
                    items:
                      type: string
                      format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/store/favorites/toggle:
    post:
      tags: [Store]
      summary: Toggle item favorite status
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: New favorite state
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFavorite:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/store/reviews:
    get:
      tags: [Store]
      summary: Get reviews for a store item
      security:
        - sessionCookie: []
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reviews list
    post:
      tags: [Store]
      summary: Submit or update a review
      description: Upserts a review for an item. One review per user per item.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, rating]
              properties:
                itemId:
                  type: string
                  format: uuid
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Upserted review
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/store/reviews/summary:
    get:
      tags: [Store]
      summary: Get review summary for all store items
      description: Returns average rating and review count per item across the entire store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Summary map
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        avg:
                          type: number
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/store/reviews/user:
    post:
      tags: [Store]
      summary: Batch-get my ratings for items
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Ratings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  ratings:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/store/orders/{orderId}:
    patch:
      tags: [Store]
      summary: Update order status (moderator)
      description: Moderator manages fulfillment — sets pickup details, approves, or denies. Points refunded on denial.
      security:
        - sessionCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, ready_for_pickup, completed, cancelled, denied]
                pickupMode:
                  type: string
                  enum: [on_site, remote]
                pickupDate:
                  type: string
                  format: date
                pickupTime:
                  type: string
                pickupDeadline:
                  type: string
                  format: date-time
                pickupNote:
                  type: string
                denialReason:
                  type: string
      responses:
        '200':
          description: Updated order
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Store]
      summary: Archive a completed order
      security:
        - sessionCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/store/orders/cleanup:
    delete:
      tags: [Store]
      summary: Archive old eligible orders in bulk
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deletedCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/store/inventory/notify:
    post:
      tags: [Store]
      summary: Notify employees of restocked items
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                moderatorName:
                  type: string
      responses:
        '200':
          description: Notification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notifiedCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/store/inventory/reset:
    post:
      tags: [Store]
      summary: Reset entire store inventory
      description: Deactivates all active store items and moves them to the recycle bin. Requires moderator_a1+.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Reset result
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/store/theme:
    patch:

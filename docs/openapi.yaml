  # ═══════════════════════════════════════
  # RAFFLES
  # ═══════════════════════════════════════

  /api/raffles:
    get:
      tags: [Raffles]
      summary: Get raffle feed
      description: Returns the current raffle feed with lifecycle state.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Raffle feed
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Raffles]
      summary: Create a raffle
      description: Creates a new live or scheduled raffle with participants and prize plan.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, title, participants]
              properties:
                mode:
                  type: string
                  enum: [live, scheduled]
                title:
                  type: string
                description:
                  type: string
                participants:
                  type: array
                  items:
                    type: object
                prizePlan:
                  type: object
                prizePlans:
                  type: array
                  items:
                    type: object
                countdownOption:
                  type: string
                removeWinnerAfterSpin:
                  type: boolean
                spinCount:
                  type: integer
                scheduledDate:
                  type: string
                  format: date
                scheduledTime:
                  type: string
      responses:
        '200':
          description: Created raffle
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Raffles]
      summary: Prune expired raffles
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/raffles/{raffleId}:
    delete:
      tags: [Raffles]
      summary: Delete a raffle
      description: Soft-deletes upcoming raffles; hard-deletes live/completed with stock restoration.
      security:
        - sessionCookie: []
      parameters:
        - name: raffleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      canRestore:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/raffles/{raffleId}/prizes:
    patch:
      tags: [Raffles]
      summary: Assign a prize to a winner
      description: Records prize assignment and manages store item stock deduction.
      security:
        - sessionCookie: []
      parameters:
        - name: raffleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                winnerParticipantId:
                  type: string
                prizeTitle:
                  type: string
                prizeSlotId:
                  type: string
                storeItemId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                imageUrl:
                  type: string
                unitPoints:
                  type: integer
                notes:
                  type: string
      responses:
        '200':
          description: Updated raffle runtime
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/raffles/{raffleId}/spin-complete:
    post:
      tags: [Raffles]
      summary: Complete a raffle spin
      description: Records the winner and optionally creates store orders for prize fulfillment.
      security:
        - sessionCookie: []
      parameters:
        - name: raffleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spinToken]
              properties:
                spinToken:
                  type: string

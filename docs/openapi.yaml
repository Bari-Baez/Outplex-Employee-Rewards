openapi: 3.0.3

info:
  title: Outplex Employee Hub API
  description: |
    Internal REST API for the **Outplex Employee Hub** platform.

    Covers overtime management, company store (NYT), employee marketplace,
    raffles, communications, forms, breaks scheduling, and admin operations.

    ## Authentication
    Most endpoints require a valid Supabase session cookie obtained after
    authenticating via **Slack OIDC** (`/auth/callback`).
    Dev/bootstrap endpoints use a service token in the `x-dev-token` header.

    ## Roles (least → most privileged)
    | Role | Description |
    |------|-------------|
    | `employee` | Regular employee — basic access |
    | `moderator_b1` | Supervisor — manages breaks, OT, and bath time |
    | `moderator_a1` | Senior moderator — full moderation suite |
    | `moderator` | General moderator |
    | `admin` | Full administrative access |

    ## Base URL
    All paths are relative to `https://outplexemplyeerewards.vercel.app`.

  version: 1.0.0
  contact:
    name: Outplex IT
    email: admintest@outplex.com

servers:
  - url: https://outplexemplyeerewards.vercel.app
    description: Production

tags:
  - name: Admin
    description: Administrative controls (admin role required)
  - name: Assets
    description: Static asset endpoints
  - name: Breaks
    description: Break schedule upload, time logging, and reporting
  - name: Communications
    description: Company announcements and push broadcasts
  - name: Departments
    description: Department list and custom department management
  - name: Dev
    description: Internal development and demo seeding endpoints
  - name: Employee Store
    description: Employee-owned marketplace — stores, products, and orders
  - name: Forms
    description: Form builder, distribution, responses, and exports
  - name: Google
    description: Google OAuth integration and Forms/Sheets sync
  - name: Moderator
    description: Moderation tools for users, stores, and point balances
  - name: Notifications
    description: User notification management
  - name: Observability
    description: Bounded browser security and operational telemetry ingestion
  - name: Onboarding
    description: New-user onboarding flow
  - name: Orders
    description: Company store (NYT) order cancellations
  - name: OT
    description: Overtime slot publishing, claiming, and management
  - name: Raffles
    description: Raffle lifecycle — creation, spinning, and prizes
  - name: Slack
    description: Slack workspace integration
  - name: Store
    description: Company store (NYT) — items, checkout, reviews, and orders
  - name: Support
    description: IT and moderator support tickets
  - name: System
    description: File upload, tool availability, and Supabase proxy
  - name: User
    description: User role requests and account actions

security:
  - sessionCookie: []

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-pdebyqbtmnqpvepvrmiw-auth-token
      description: Supabase session cookie set after Slack OIDC authentication.
    devToken:
      type: apiKey
      in: header
      name: x-dev-token
      description: Service token for dev/bootstrap endpoints (`DEV_BOOTSTRAP_TOKEN` env var).

  responses:
    Unauthorized:
      description: Authentication required — no valid session cookie present.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
    Forbidden:
      description: Valid session exists but role is insufficient.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
    BadRequest:
      description: Invalid or missing request parameters/body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Success:
      description: Operation completed successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

  schemas:

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Unauthorized

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true

    UserRole:
      type: string
      enum: [employee, moderator_b1, moderator_a1, moderator, admin, staff]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        department:
          type: string
          nullable: true
        employee_id:
          type: string
          nullable: true
        supervisor_id:
          type: string
          format: uuid
          nullable: true
        is_approved:
          type: boolean
        points:
          type: integer
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    OtSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        start_time:
          type: string
          example: '08:00'
        end_time:
          type: string
          example: '12:00'
        duration_hrs:
          type: number
        shift_label:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, claimed, cancelled]
        claimed_by:
          type: string
          format: uuid
          nullable: true
        claim_kind:
          type: string
          enum: [day_off, scheduled_extension, recovery]
          nullable: true

    StoreItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        points_cost:
          type: integer
        stock:
          type: integer
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        category:
          type: string
          nullable: true
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
        total_points:
          type: integer
        status:
          type: string
          enum: [pending, ready_for_pickup, completed, cancelled, denied]
        pickup_mode:
          type: string
          enum: [on_site, remote]
          nullable: true
        pickup_date:
          type: string
          format: date
          nullable: true
        pickup_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    StoreReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        excerpt:
          type: string
          nullable: true
        cover_image_url:
          type: string
          nullable: true
        content:
          type: array
          items:
            type: object
            description: "Content block (type: text | image | slider | pdf)"
        action:
          type: string
          enum: [draft, scheduled, published]
        publish_at:
          type: string
          format: date-time
          nullable: true
        duration_days:
          type: integer
        created_at:
          type: string
          format: date-time

    AnnouncementInput:
      type: object
      required: [title, action]
      properties:
        title:
          type: string
        excerpt:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        content:
          type: array
          items:
            type: object
        durationDays:
          type: integer
        action:
          type: string
          enum: [draft, scheduled, published]
        publishAt:
          type: string
          format: date-time
          nullable: true

    BreakSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        schedule_date:
          type: string
          format: date
        shift_in:
          type: string
          nullable: true
        shift_out:
          type: string
          nullable: true
        first_break:
          type: string
          nullable: true
        lunch:
          type: string
          nullable: true
        second_break:
          type: string
          nullable: true
        third_break:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]

    SupportTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        department:
          type: string
          enum: [it, moderator]
        subject:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        created_at:
          type: string
          format: date-time

    EmployeeStore:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, paused, closed, suspended]
        is_open:
          type: boolean
        created_at:
          type: string
          format: date-time

    EmployeeStoreProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price_dop:
          type: number
        cost_dop:
          type: number
        stock:
          type: integer
        image_url:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        is_active:
          type: boolean
        status:
          type: string
          enum: [pending, active, rejected, out_of_stock]

    Form:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, closed]
        is_mandatory:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    RoleRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, reviewing, approved, rejected]
        role:
          $ref: '#/components/schemas/UserRole'
        functional_area:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Raffle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        mode:
          type: string
          enum: [live, scheduled, completed]
        spin_count:
          type: integer
        remove_winner_after_spin:
          type: boolean
        scheduled_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ═══════════════════════════════════════
  # ADMIN
  # ═══════════════════════════════════════

  /api/admin/tools:
    get:
      tags: [Admin]
      summary: Get tool/section availability state
      description: Returns current state of all tool toggles, section availability, and the maintenance banner.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Availability state
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: object
                    additionalProperties:
                      type: boolean
                  sections:
                    type: object
                    additionalProperties:
                      type: boolean
                  banner:
                    type: object
                    properties:
                      active:
                        type: boolean
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Update tool/section availability or maintenance banner
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                toolUpdates:
                  type: object
                  additionalProperties:
                    type: boolean
                sectionUpdates:
                  type: object
                  additionalProperties:
                    type: boolean
                banner:
                  type: object
                  properties:
                    active:
                      type: boolean
                    message:
                      type: string
      responses:
        '200':
          description: Updated state
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/logout:
    post:
      tags: [Admin]
      summary: Force-logout a user
      description: Revokes all active Supabase sessions for a specific user.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════
  # ASSETS
  # ═══════════════════════════════════════

  /api/assets/outplex-logo:
    get:
      tags: [Assets]
      summary: Redirect to Outplex logo PNG
      security: []
      responses:
        '307':
          description: Redirect to /outplex-logo.png (no-store cache)

  # ═══════════════════════════════════════
  # BREAKS
  # ═══════════════════════════════════════

  /api/breaks/my-schedule:
    get:
      tags: [Breaks]
      summary: Get my schedule for today
      description: Returns the authenticated employee's published break schedule and time logs for today.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Today's schedule and time logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    allOf:
                      - $ref: '#/components/schemas/BreakSchedule'
                    nullable: true
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        log_id:
                          type: string
                          format: uuid
                        event_type:
                          type: string
                        actual_start:
                          type: string
                          format: date-time
                        actual_end:
                          type: string
                          format: date-time
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/breaks/report:
    post:
      tags: [Breaks]
      summary: Start a break event
      description: |
        Employee logs the start of a break with a server-side timestamp.
        A `delay_reason` is required when the report is >5 minutes late.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daily_schedule_id, event_type]
              properties:
                daily_schedule_id:
                  type: string
                  format: uuid
                event_type:
                  type: string
                  enum: [shift_in, first_break, lunch, second_break, third_break, shift_out]
                delay_reason:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Break log created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  log:
                    type: object
                  varianceMinutes:
                    type: number
                    nullable: true
                  scheduledEnd:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/breaks/report-end:
    post:
      tags: [Breaks]
      summary: End a break event
      description: Closes the active time log entry with a server-side end timestamp.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log_id]
              properties:
                log_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Break ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  actual_end:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/breaks/report/export:
    get:
      tags: [Breaks]
      summary: Export break variance report (Excel)
      description: |
        Generates an `.xlsx` file with color-coded delay variance data and
        an employee summary sheet. Requires moderator_b1 or above.
      security:
        - sessionCookie: []
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: lob
          in: query
          description: Filter by line of business / department
          schema:
            type: string
      responses:
        '200':
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/breaks/upload:
    post:
      tags: [Breaks]
      summary: Upload schedule file (CSV / Excel)
      description: Parses the file, matches employees, and creates a batch for review. Requires moderator_a1+.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or Excel schedule file (max 10 MB)
                force_replace:
                  type: string
                  enum: ['true', 'false']
                  description: Replace an existing schedule for the same date
      responses:
        '200':
          description: Batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  batchId:
                    type: string
                    format: uuid
                  batchName:
                    type: string
                  scheduleDate:
                    type: string
                    format: date
                  matched:
                    type: integer
                  pendingReview:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/breaks/manual-entry:
    post:
      tags: [Breaks]
      summary: Manually create an employee schedule
      description: Moderator creates a single daily schedule for an employee with break times.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleDate, employeeId]
              properties:
                scheduleDate:
                  type: string
                  format: date
                employeeId:
                  type: string
                  format: uuid
                shiftIn:
                  type: string
                  example: '08:00'
                shiftOut:
                  type: string
                  example: '17:00'
                firstBreak:
                  type: string
                  nullable: true
                lunch:
                  type: string
                  nullable: true
                secondBreak:
                  type: string
                  nullable: true
                thirdBreak:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/breaks/match-agent:
    post:
      tags: [Breaks]
      summary: Manually match an unmatched agent to a user
      description: Links a raw name from the uploaded schedule to a platform user ID.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, rawName, userId]
              properties:
                batchId:
                  type: string
                  format: uuid
                rawName:
                  type: string
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Match result
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/breaks/live-sync:
    post:
      tags: [Breaks]
      summary: Sync schedule from Microsoft 365 / SharePoint
      description: Pulls schedule data from Microsoft Graph API and auto-creates a batch. Requires moderator_b1+.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  batchId:
                    type: string
                    format: uuid
                  matched:
                    type: integer
                  pendingReviewCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/breaks/bath-time/active:
    get:
      tags: [Breaks]
      summary: Get active bath-time logs (supervisors)
      description: Lists all currently open bath-time log entries for today. Requires moderator_b1+.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeCount:
                    type: integer
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        log_id:
                          type: string
                          format: uuid
                        employee:
                          type: string
                        actual_start:
                          type: string
                          format: date-time
                        duration_minutes:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/breaks/batches/{batchId}/schedules:
    get:
      tags: [Breaks]
      summary: Get all schedules in a batch
      description: Fetches every daily schedule record in the batch with joined employee info.
      security:
        - sessionCookie: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Schedules array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BreakSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Breaks]
      summary: Bulk-upsert batch schedules
      description: Replaces or creates multiple schedule rows. Requires moderator_a1+.
      security:
        - sessionCookie: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    $ref: '#/components/schemas/BreakSchedule'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


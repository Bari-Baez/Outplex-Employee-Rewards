                message:
                  type: string
      responses:
        '200':
          description: Created ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SupportTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/support/tickets/{ticketId}:
    patch:
      tags: [Support]
      summary: Update ticket status
      description: Moderators update ticket status. Department-based access restrictions apply.
      security:
        - sessionCookie: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

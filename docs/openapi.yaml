        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════
  # SYSTEM
  # ═══════════════════════════════════════

  /api/upload:
    post:
      tags: [System]
      summary: Upload file to Supabase Storage
      description: Accepts any file up to 10 MB, stores it, and returns the public URL.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Any file type (max 10 MB)
                folder:
                  type: string
                  description: Storage folder path (optional, defaults to 'public/')
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tools:
    get:
      tags: [System]
      summary: Get tool/section availability (client-side)
      description: Used by the React client to determine which features are enabled.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Tool and section state
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: object
                  sections:
                    type: object
                  banner:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/supabase-proxy/{supabasePath}:
    get:
      tags: [System]
      summary: Proxy GET to Supabase REST API
      description: |
        Forwards requests to Supabase. Paths under `auth/v1/` are public (used for OAuth).
        All other paths require a valid session. Used internally by the Supabase JS client.
      security:
        - sessionCookie: []
      parameters:
        - name: supabasePath
          in: path
          required: true
          schema:
            type: string
          description: Supabase REST path (e.g. `rest/v1/users`)
      responses:
        '200':
          description: Proxied Supabase response
    options:
      tags: [System]
      summary: Proxy OPTIONS to Supabase API
      security:
        - sessionCookie: []
      parameters:
        - name: supabasePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied Supabase preflight response
    head:
      tags: [System]
      summary: Proxy HEAD to Supabase API
      security:
        - sessionCookie: []
      parameters:

        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: object
                  description: StoreThemeConfig — color palette and layout preferences
      responses:
        '200':
          description: Updated theme
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════
  # SUPPORT
  # ═══════════════════════════════════════

  /api/support/tickets:

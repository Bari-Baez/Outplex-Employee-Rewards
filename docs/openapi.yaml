      description: |
        Creates preset demo accounts for development and presentation.
        **Disabled in production** (`ALLOW_PUBLIC_DEMO_BOOTSTRAP=false`).
        Requires `x-dev-token` header matching `DEV_BOOTSTRAP_TOKEN`.
      security:
        - devToken: []
      responses:
        '200':
          description: Bootstrap result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        role:
                          $ref: '#/components/schemas/UserRole'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/dev/promote:
    post:
      tags: [Dev]
      summary: Promote demo user to a role
      description: |
        Upserts a demo user's role. Internal use only.
        Requires `x-dev-token` header.
      security:
        - devToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Promotion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: boolean
                  msg:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'


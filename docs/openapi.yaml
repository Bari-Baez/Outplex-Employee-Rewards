  # ═══════════════════════════════════════
  # USER
  # ═══════════════════════════════════════

  /api/user/role-request/status:
    get:
      tags: [User]
      summary: Get current role request status
      description: Returns the status and details of the user's most recent role request.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Role request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, reviewing, approved, rejected]
                    nullable: true
                  request:
                    allOf:
                      - $ref: '#/components/schemas/RoleRequest'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/user/role-request/acknowledge:
    post:
      tags: [User]
      summary: Acknowledge an approved role request
      description: Marks the user as fully approved and deletes the approved role request record.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/user/role-request/cancel:
    post:
      tags: [User]
      summary: Cancel a pending role request
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/user/clear-revoke:
    post:
      tags: [User]
      summary: Clear role revocation timestamp
      description: Resets the `role_revoked_at` field, allowing the user to re-enter the platform normally.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Additional implemented routes captured by the route-contract gate.

  /api/dashboard/shell:
    get:
      tags: [System]
      summary: Load the authenticated dashboard shell snapshot
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User-scoped notifications, support tickets, points, and shared shell data
          content:
            application/json:
              schema:
                type: object
                required: [notifications, tickets, pointsBalance, shared]
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  tickets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  pointsBalance:
                    type: number
                  shared:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/gif/search:
    get:
      tags: [System]
      summary: Search or list trending GIFs for an authenticated user
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: GIF search results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {}
                        title: {}
                        gif:
                          type: string
                        tinygif:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: GIF provider is not configured

  /api/media/proxy:
    get:
      tags: [System]
      summary: Fetch bounded public media through the SSRF-safe proxy
      security:
        - sessionCookie: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Proxied image, audio, video, PDF, or binary media
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing, invalid, or blocked URL
        '413':
          description: Upstream body exceeds the configured limit
        '415':
          description: Unsupported upstream media type
        '416':
          description: Invalid range header
        '502':
          description: Upstream network failure
        '504':
          description: Upstream timeout

  /api/ocr:
    post:
      tags: [System]
      summary: Extract bounded OT rows from an uploaded image
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: OCR attempts and normalized rows
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Image or multipart body is too large
        '415':
          description: Expected multipart form data
        '503':
          description: OCR provider is unavailable or not configured

  /api/ocr/metrics:
    post:
      tags: [System]
      summary: Extract bounded performance metrics from an uploaded image

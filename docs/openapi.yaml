      security: []
      responses:
        '200':
          description: Connection state
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  email:
                    type: string
                    nullable: true
                  connectedAt:
                    type: string
                    format: date-time
                    nullable: true
    delete:
      tags: [Google]
      summary: Disconnect Google account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Disconnected

  /api/google/connect:
    get:
      tags: [Google]
      summary: Initiate Google OAuth flow
      description: Redirects to Google consent page with CSRF nonce. Requires moderator_a1 or admin.
      security:
        - sessionCookie: []
      responses:
        '302':
          description: Redirect to Google OAuth URL

  /api/google/callback:
    get:
      tags: [Google]
      summary: Google OAuth callback handler
      description: Exchanges auth code for tokens and redirects to settings page.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to /settings

  /api/google/forms:
    get:
      tags: [Google]
      summary: List Google Forms from Drive
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Google Forms list
          content:
            application/json:
              schema:
                type: object
                properties:
                  forms:
                    type: array
                    items:
                      type: object

  /api/google/forms/import:
    post:
      tags: [Google]
      summary: Import a Google Form
      description: Converts a Google Form into an Outplex form. Requires moderator_a1+.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googleFormId]
              properties:
                googleFormId:
                  type: string
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  formId:
                    type: string
                    format: uuid
                  alreadyExists:
                    type: boolean
                  fieldCount:
                    type: integer

  /api/google/sheets/export:
    post:
      tags: [Google]
      summary: Export form responses to Google Sheets
      description: Creates a new Google Sheet with all responses. Form moderator required.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formId]
              properties:
                formId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Sheet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  spreadsheetId:
                    type: string
                  spreadsheetUrl:
                    type: string
                  rowsWritten:
                    type: integer
                  cellsWritten:
                    type: integer

  # ═══════════════════════════════════════
  # MODERATOR
  # ═══════════════════════════════════════

  /api/moderator/users/access-review:
    post:
      tags: [Moderator]
      summary: Approve or deny platform access for a new user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, decision]
              properties:
                userId:
                  type: string
                  format: uuid
                decision:
                  type: string
                  enum: [approved, denied]
                reason:
                  type: string
                  description: Required when decision is "denied"
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/users/update:
    post:
      tags: [Moderator]
      summary: Update user profile and role
      description: Updates role, department, supervisor, and profile fields. Resets approval if role changes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                role:
                  $ref: '#/components/schemas/UserRole'
                department:
                  type: string
                supervisor_id:
                  type: string
                  format: uuid
                is_approved:
                  type: boolean
                name:
                  type: string
                employee_id:
                  type: string
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  roleChanged:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/users/revoke:
    post:
      tags: [Moderator]
      summary: Revoke user's special role
      description: Resets role to employee and sets `role_revoked_at` timestamp with full audit trail.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/users/delete:
    post:
      tags: [Moderator]
      summary: Permanently delete user
      description: Removes user from both the public profile table and Supabase Auth. Admin only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/roles/approve:
    post:
      tags: [Moderator]
      summary: Approve or reject a role upgrade request
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, role, department, decision]
              properties:
                requestId:
                  type: string
                  format: uuid
                role:
                  $ref: '#/components/schemas/UserRole'
                department:
                  type: string
                decision:
                  type: string
                  enum: [approved, rejected]
                notes:
                  type: string
      responses:
        '200':
          description: Decision result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  decision:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/points:
    post:
      tags: [Moderator]
      summary: Update employee point balances
      description: |
        Accepts either `assignments` (by email/employee_id) or `updates` (by userId).
        Requires moderator or admin.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      identifier:
                        type: string
                        description: Employee email or employee_id
                      points:
                        type: integer
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      points:
                        type: integer
                      reason:
                        type: string
                reason:
                  type: string
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updatedCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/points/reset:
    post:
      tags: [Moderator]
      summary: Reset ALL employee points to zero
      description: |
        Zeroes every non-zero point balance with a full audit trail.
        The body must include `confirm: "RESET"` as a safety gate.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: ['RESET']
                  description: Must be exactly the string "RESET"
                reason:
                  type: string
      responses:
        '200':
          description: Reset result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  resetCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/employee-store/stores:
    patch:
      tags: [Moderator]
      summary: Update employee store status
      description: Admin/moderator_a1 can pause, close, or suspend a store.
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                storeId:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [active, paused, closed, suspended]
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Moderator]
      summary: Permanently delete employee store
      security:
        - sessionCookie: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/employee-store/requests:
    get:
      tags: [Moderator]
      summary: List store creation requests and existing stores
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Requests and stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                  stores:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/employee-store/requests/{requestId}:
    patch:
      tags: [Moderator]
      summary: Approve or reject a store creation request
      security:
        - sessionCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                notes:
                  type: string
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
      responses:
        '200':
          description: Decision result
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/employee-store/products:
    get:
      tags: [Moderator]
      summary: List all employee store products
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Products list
    patch:
      tags: [Moderator]
      summary: Approve, reject, or suspend a product
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [active, rejected, out_of_stock]
                reviewNotes:
                  type: string
                is_suspended:
                  type: boolean
                suspend_reason:
                  type: string
      responses:
        '200':
          description: Updated product
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Moderator]
      summary: Delete employee store product
      security:
        - sessionCookie: []
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/moderator/maintenance/cleanup-logs:
    post:
      tags: [Moderator]
      summary: Run bounded platform-runtime cleanup
      description: |
        Deletes expired rate-limit buckets and idempotency records plus old
        processed/dead outbox jobs. Each category is capped at 1,000 rows per run.
        Requires an approved admin session or the configured cron bearer secret.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  purged:
                    type: object
                    required: [rateLimitBuckets, idempotencyKeys, outboxJobs]
                    properties:
                      rateLimitBuckets:
                        type: integer
                        minimum: 0
                      idempotencyKeys:
                        type: integer
                        minimum: 0
                      outboxJobs:
                        type: integer
                        minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Maintenance rate limit exceeded

  /api/observability/csp-report:
    post:
      tags: [Observability]
      summary: Accept bounded Content Security Policy violation reports
      description: |
        Public browser-report endpoint. Accepts at most 32 KiB and records only
        directive, disposition, and status code; document and blocked URLs,
        source locations, samples, headers, and cookies are not retained.
      security: []
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/reports+json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '204':
          description: Report accepted
        '400':
          description: Invalid report payload
        '413':
          description: Report body exceeds 32 KiB
        '415':
          description: Unsupported report content type
        '429':
          description: Report ingestion rate limit exceeded
        '500':
          description: Report could not be accepted

  # ═══════════════════════════════════════
  # NOTIFICATIONS
  # ═══════════════════════════════════════

  /api/notifications:
    delete:
      tags: [Notifications]
      summary: Clear all notifications
      description: |
        Deletes every notification for the authenticated user.
        Notifications are typically fetched directly via the Supabase client SDK,
        not through a REST endpoint.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{notificationId}:
    delete:
      tags: [Notifications]
      summary: Delete a single notification
      security:
        - sessionCookie: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/mutes:
    post:
      tags: [Notifications]
      summary: Mute notifications from a sender
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderId]
              properties:
                senderId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/mutes/{senderId}:
    delete:
      tags: [Notifications]
      summary: Unmute notifications from a sender
      security:
        - sessionCookie: []
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════
  # ONBOARDING
  # ═══════════════════════════════════════

  /api/onboarding/supervisors:
    get:
      tags: [Onboarding]
      summary: List supervisors for the onboarding dropdown
      description: Returns all users with `moderator_b1` role as selectable supervisors.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Supervisors list
          content:
            application/json:
              schema:
                type: object
                properties:
                  supervisors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/onboarding/complete-profile:
    post:
      tags: [Onboarding]
      summary: Complete user profile during onboarding
      description: Saves name, employee ID, department, and supervisor assignment for a new user.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, employee_id, department, supervisor_id]
              properties:
                name:
                  type: string
                employee_id:
                  type: string
                department:
                  type: string
                supervisor_id:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/onboarding/request-access:
    post:
      tags: [Onboarding]
      summary: Submit specialized access request
      description: Creates a `role_request` record and notifies the moderator team.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, employee_id, functional_area, reason]
              properties:
                name:
                  type: string
                employee_id:
                  type: string
                functional_area:
                  type: string
                  description: e.g. QA, Workforce Management, Senior Operations
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════
  # ORDERS (NYT Company Store)
  # ═══════════════════════════════════════

  /api/orders/cancel:
    post:
      tags: [Orders]
      summary: Cancel a company store order
      description: Cancels a pending order within the 5-minute cancellation window and refunds points.
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key reused for retries of the same logical cancellation.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════
  # OT (Overtime)
  # ═══════════════════════════════════════

  /api/ot/claim:
    post:
      tags: [OT]
      summary: Claim an OT slot
      description: Claims an available slot. Validates for time overlaps and daily claim limits.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, claimKind]
              properties:
                slotId:
                  type: string
                  format: uuid
                claimKind:
                  type: string
                  enum: [day_off, scheduled_extension, recovery]
      responses:
        '200':
          description: Claimed slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OtSlot'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/ot/unclaim:
    post:
      tags: [OT]
      summary: Release a claimed OT slot
      description: Releases the slot within the 20-minute unclaim window.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Released slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OtSlot'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/ot/publish:
    post:
      tags: [OT]
      summary: Publish OT batch from CSV rows
      description: Creates or updates an OT batch with slots. Posts Slack notification when published.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, batchName, status]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                  description: Parsed CSV rows from the OT upload
                batchName:
                  type: string
                batchId:
                  type: string
                  format: uuid
                  description: Provide to update an existing batch
                status:
                  type: string
                  enum: [published, draft]
      responses:
        '200':
          description: Published batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OtSlot'
                  batch:
                    type: object
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/ot/slots/{slotId}:
    patch:
      tags: [OT]
      summary: Update an OT slot
      description: Edits slot date, time, assignment, or status with conflict checking and user notifications.
      security:
        - sessionCookie: []
      parameters:
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                start_time:
                  type: string
                  example: '08:00'
                end_time:
                  type: string
                  example: '12:00'
                shift_label:
                  type: string
                assignedUserId:
                  type: string
                  format: uuid
                claimKind:
                  type: string
                  enum: [day_off, scheduled_extension, recovery]
                status:
                  type: string
                  enum: [available, claimed, cancelled]
      responses:
        '200':
          description: Updated slot
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [OT]
      summary: Cancel an OT slot
      security:
        - sessionCookie: []
      parameters:
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
